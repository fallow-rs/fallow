[package]
name = "fallow"
version = "3.41.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/fallow-rs/fallow"
homepage = "https://fallow.tools/docs/"
documentation = "https://fallow.tools/docs/"
keywords = ["typescript", "javascript", "lint", "static-analysis", "code-quality"]
categories = ["command-line-utilities", "development-tools"]
description = "Codebase intelligence for TypeScript and JavaScript. Installs the fallow command of fallow-cli. For Rust, install cargo-fallow"
readme = "README.md"

[[bin]]
name = "fallow"
path = "src/main.rs"

# The release publishes this crate after fallow-cli, with the same version and
# an exact requirement. `cargo install` skips an installed version, so a fixed
# wrapper version would never get a new fallow-cli.
# `scripts/sync-npm-versions.sh` bumps both values.
[dependencies]
fallow-cli = "=3.41.0"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

# This crate is not a workspace member. A second `fallow` binary in the
# workspace would collide with the binary of fallow-cli in `target/`.
[workspace]
