# cargo-nextest configuration. CI selects a profile with `--profile`.
# Local `cargo nextest run` keeps the default profile.

# 0.9.123 is the first version with the table form of `[experimental]`.
nextest-version = "0.9.123"

[experimental]
setup-scripts = true

# Each run gets its own TMPDIR. Without it, the audit base snapshot caches
# that earlier runs left in the shared temp directory make each `fallow
# audit` in the suite probe thousands of stale entries. See the script.
# The other profiles inherit this rule from `default`.
[scripts.setup.run-tmpdir]
command = "scripts/nextest-run-tmpdir.sh"

[[profile.default.scripts]]
platform = { host = "cfg(unix)" }
filter = "all()"
setup = "run-tmpdir"

# CI runs every test so one run shows every failure. No retries: a retry
# hides a flaky test. The JUnit report gives per-test timings and a
# failure record. It is written to target/nextest/ci/junit.xml.
[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# Nextest starts tests in binary and name order. A slow test that sorts late
# then runs alone at the end of a partition, and the partition waits for it:
# the surface differential test ended a CI partition in each sampled run. These tests take 25 seconds or more each, so they start first.
[[profile.ci.overrides]]
filter = """
test(/^permutation::oracle::/)
| test(/^surface_differential::/)
| test(/^mutation::cache_model::sequences::/)
| test(/^mutation_tests::interrupt::/)
| test(=opt_in_mutants_run_like_the_applied_mutant)
| test(=schema_tests::json_schema_vec_and_option_skip_fields_have_serde_default)
"""
priority = 100
