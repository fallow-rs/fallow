[package]
name = "fallow-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Prevent this crate from joining the parent workspace
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
fallow-config = { path = "../crates/config" }
fallow-core = { path = "../crates/core" }
fallow-engine = { path = "../crates/engine" }
fallow-extract = { path = "../crates/extract" }
fallow-types = { path = "../crates/types" }
bitcode = "0.6"
dunce = "1"
serde_json = "1"
toml = "1.1"

[[bin]]
name = "fuzz_sfc"
path = "fuzz_targets/fuzz_sfc.rs"

[[bin]]
name = "fuzz_mdx"
path = "fuzz_targets/fuzz_mdx.rs"

[[bin]]
name = "fuzz_astro"
path = "fuzz_targets/fuzz_astro.rs"

[[bin]]
name = "fuzz_css"
path = "fuzz_targets/fuzz_css.rs"

[[bin]]
name = "fuzz_scripts"
path = "fuzz_targets/fuzz_scripts.rs"

[[bin]]
name = "fuzz_extract"
path = "fuzz_targets/fuzz_extract.rs"

[[bin]]
name = "fuzz_config_glob"
path = "fuzz_targets/fuzz_config_glob.rs"

[[bin]]
name = "fuzz_workspace_manifests"
path = "fuzz_targets/fuzz_workspace_manifests.rs"

[[bin]]
name = "fuzz_config_files"
path = "fuzz_targets/fuzz_config_files.rs"

[[bin]]
name = "fuzz_extract_cache"
path = "fuzz_targets/fuzz_extract_cache.rs"

[[bin]]
name = "fuzz_codeowners"
path = "fuzz_targets/fuzz_codeowners.rs"
