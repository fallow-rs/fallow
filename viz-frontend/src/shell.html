<div id="app" data-static-shell>
  <header id="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div class="brand-text">
        <span class="wordmark">fallow</span><span class="project">__FALLOW_ROOT__</span
        ><span class="sub">Codebase map</span>
      </div>
    </div>
  </header>
  <nav id="toolbar"></nav>
  <div id="lens-summary" class="visible"></div>
  <main id="stage">
    <div class="map-loading" role="status">
      <div class="map-loading-card">
        <p class="map-loading-title">Building the map</p>
        <div class="map-loading-track indeterminate"><div class="map-loading-fill"></div></div>
        <p class="map-loading-step">Reading the data</p>
      </div>
    </div>
  </main>
  <footer id="statusline">
    <div id="crumbs"><span class="current">&nbsp;</span></div>
    <span id="hints"
      ><span class="hint-item"><b>/</b> Search</span></span
    >
  </footer>
</div>
