[package]
name = "fallow-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "MCP server for fallow codebase intelligence (exposes fallow as typed tools to AI agents)"
readme = "../../README.md"

[lib]
name = "fallow_mcp"
path = "src/lib.rs"

[[bin]]
name = "fallow-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1", features = ["transport-io"] }
rquickjs = "0.12"
fallow-api = { workspace = true, features = ["schema"] }
fallow-process = { workspace = true, features = ["tokio"] }
fallow-types.workspace = true
rustc-hash = { workspace = true }
tokio.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
schemars.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
regex.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true

[lints]
workspace = true
