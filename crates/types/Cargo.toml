[package]
name = "fallow-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://fallow.tools/docs/"
keywords.workspace = true
categories.workspace = true
description = "Shared types and serde paths for fallow codebase intelligence"
readme = "../../README.md"

[dependencies]
# Serialization
serde = { workspace = true }

# AST spans (for ExportInfo, ImportInfo, etc.)
oxc_span = { workspace = true }

# Cache serialization (for MemberAccess)
bitcode = { workspace = true }

# JSON Schema generation for the public JSON output contract.
# Gated by the `schema` feature. fallow-config enables it for every build,
# because the config schema embeds `SemanticAnalysisIdentity` through
# `RegressionBaseline`, so in practice the derives always compile.
schemars = { workspace = true, optional = true }
# `serde_json` carries the free-form rule-object payload on
# `AddToConfigValue::RuleObject` in the `output` module. The module is no
# longer feature-gated (typed action wrappers in `output_dead_code` use
# `IssueAction` at runtime), so `serde_json` ships unconditionally.
serde_json = { workspace = true }
rustc-hash = { workspace = true }
# Unique temp files for the atomic cache write in `atomic_file`.
tempfile = { workspace = true }

# The owner check of the scope base in `read_scope`, and the open of a file
# that does not wait for a FIFO writer in `read_guard`.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

# The owner SID lookups of the scope base in `read_scope`.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Authorization"] }

[features]
# Adds `#[derive(schemars::JsonSchema)]` to result and extract types so the
# JSON output schema can be regenerated from the Rust source of truth.
schema = ["dep:schemars"]
# Counts the path resolutions of `read_guard`, for cost tests of other
# crates.
testing = []

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
