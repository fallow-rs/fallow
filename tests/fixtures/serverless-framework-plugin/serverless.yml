service: TestService

provider:
  name: aws
  runtime: nodejs20.x
  stage: '${opt:stage, "dev"}'
  iamRoleStatements:
    - Effect: Allow
      Action: s3:GetObject
      Resource: !Sub 'arn:aws:s3:::${self:custom.bucket}/*'

plugins:
  - serverless-esbuild
  - ${file(./shared.yml):localPlugin}
  - ./plugins/local-plugin

custom:
  esbuild:
    bundle: true
    inject:
      - ./src/globals.ts

functions:
  - First:
      handler: function/handler.js.handler
    Second:
      handler: function-2/function2.handler
      environment:
        FOO: !Ref SomeResource
  - ${file(./functions.yml)}
  - hello: ${file(./shared.yml):functions.hello}
