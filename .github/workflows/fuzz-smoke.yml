name: Fuzz Smoke

# Runs on main, on a weekly schedule, and on demand, to keep pull request jobs
# few. A crash found on main shows before a release can start.
on:
  push:
    branches: [main]
    paths:
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/extract/**'
      - 'crates/core/**'
      - 'crates/types/**'
      - 'crates/graph/**'
      - 'crates/config/**'
      - 'crates/security/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/fuzz-smoke.yml'
  schedule:
    - cron: '30 5 * * 0'
  workflow_dispatch:

# Pull requests and ordinary pushes to main share one group per ref, so a
# newer run cancels the older one. Main gets many merges a day, and only the
# newest main commit needs a result. The release commit ("chore: release v")
# and manual or scheduled runs get a group of their own and are never
# cancelled: scripts/verify-release-ci.mjs reads the result for the release
# commit before a release can start.
concurrency:
  group: "fuzz-smoke-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v'))) && github.ref || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v')) }}"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
  FUZZ_TIME_SECONDS: ${{ github.event_name == 'schedule' && '300' || '30' }}

jobs:
  fuzz-smoke:
    name: Fuzz harness smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: nightly-2026-07-20

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: fuzz -> target
          key: fuzz-smoke-nightly-2026-07-20-cargo-fuzz-0.13.2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-fuzz@0.13.2
          fallback: cargo-install

      - name: Verify locked fuzz dependencies
        run: cargo +nightly-2026-07-20 metadata --locked --no-deps --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null

      - name: Run bounded fuzz smoke
        shell: bash
        run: |
          set -u
          targets=(fuzz_sfc fuzz_mdx fuzz_astro fuzz_css fuzz_scripts)
          failed=0
          for target in "${targets[@]}"; do
            echo "::group::Fuzz ${target}"
            if ! cargo +nightly-2026-07-20 fuzz run --target "$FUZZ_TARGET_TRIPLE" "$target" -- -max_total_time="$FUZZ_TIME_SECONDS" -timeout=10; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
