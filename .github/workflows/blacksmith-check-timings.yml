      fail-fast: false
      matrix:
        include:
        - provider: github
          runner: ubuntu-24.04
        - provider: blacksmith
          runner: blacksmith-4vcpu-ubuntu-2404
    needs:
    - check-cold
    if: ${{ !cancelled() }}
