name: Binary Size

# Runs on main and on demand. A pull request runs these jobs only when it
# carries the "ci:perf" label, to keep pull request jobs few. Add the label to
# get a result before merge. Without it, a change shows one commit later on main.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bloat.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bloat.yml'
  workflow_dispatch:

# Pull requests and ordinary pushes to main share one group per ref, so a
# newer run cancels the older one. Main gets many merges a day, and only the
# newest main commit needs a result. The release commit ("chore: release v")
# and manual or scheduled runs get a group of their own and are never
# cancelled: scripts/verify-release-ci.mjs reads the result for the release
# commit before a release can start.
# A "labeled" event for another label also gets a group of its own, so it
# does not cancel a real ci:perf run (its jobs skip).
concurrency:
  group: "bloat-${{ ((github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name != 'ci:perf')) || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v'))) && github.ref || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v')) }}"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-bloat:
    name: CLI size analysis
    runs-on: ubuntu-latest
    # On a pull request, run only with the "ci:perf" label. Skip a "labeled"
    # event for another label, so it does not start a second run.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:perf') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:perf'))
    timeout-minutes: 20
    # Keep debug info only for cargo-bloat function name resolution. The
    # shipped-binary job uses the stripped production release profile.
    env:
      CARGO_PROFILE_RELEASE_STRIP: "none"
      CARGO_PROFILE_RELEASE_DEBUG: "2"
    permissions:
      contents: read
    outputs:
      bytes: ${{ steps.binary-size.outputs.bytes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bloat-cli

      - name: Install cargo-bloat
        run: cargo install cargo-bloat --locked

      - name: Report top functions by size
        run: |
          {
            echo "## Top 20 functions by size"
            echo '```'
            cargo bloat --release -p fallow-cli -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report top crates by size
        run: |
          {
            echo "## Top 20 crates by size"
            echo '```'
            cargo bloat --release -p fallow-cli --crates -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture CLI binary size
        id: binary-size
        run: echo "bytes=$(stat --format=%s target/release/fallow)" >> "$GITHUB_OUTPUT"

  shipped-binaries:
    name: Shipped binary sizes
    runs-on: ubuntu-latest
    # On a pull request, run only with the "ci:perf" label. Skip a "labeled"
    # event for another label, so it does not start a second run.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:perf') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:perf'))
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      lsp_bytes: ${{ steps.binary-sizes.outputs.lsp_bytes }}
      mcp_bytes: ${{ steps.binary-sizes.outputs.mcp_bytes }}
      multicall_bytes: ${{ steps.binary-sizes.outputs.multicall_bytes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bloat-shipped

      # Keep the normal release build separate from cargo-bloat's instrumented
      # build. Running both artifact sets in one job exceeds the runner budget.
      - name: Build the LSP, MCP, and multicall binaries
        run: cargo build --release -p fallow-lsp -p fallow-mcp -p fallow-multicall

      - name: Capture shipped binary sizes
        id: binary-sizes
        run: |
          {
            echo "lsp_bytes=$(stat --format=%s target/release/fallow-lsp)"
            echo "mcp_bytes=$(stat --format=%s target/release/fallow-mcp)"
            echo "multicall_bytes=$(stat --format=%s target/release/fallow-multicall)"
          } >> "$GITHUB_OUTPUT"

  bloat:
    name: Binary size tracking
    needs:
      - cli-bloat
      - shipped-binaries
    # always() keeps the failure report when a size build fails. The label
    # rule keeps this job off pull requests without "ci:perf".
    if: ${{ always() && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:perf') && (github.event.action != 'labeled' || github.event.label.name == 'ci:perf'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require successful size builds
        env:
          CLI_RESULT: ${{ needs.cli-bloat.result }}
          SHIPPED_RESULT: ${{ needs.shipped-binaries.result }}
        run: |
          if [ "$CLI_RESULT" != "success" ] || [ "$SHIPPED_RESULT" != "success" ]; then
            echo "::error::Binary size prerequisites failed: cli=$CLI_RESULT, shipped=$SHIPPED_RESULT"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Track total binary size
        env:
          FALLOW_BYTES: ${{ needs.cli-bloat.outputs.bytes }}
          FALLOW_LSP_BYTES: ${{ needs.shipped-binaries.outputs.lsp_bytes }}
          FALLOW_MCP_BYTES: ${{ needs.shipped-binaries.outputs.mcp_bytes }}
          FALLOW_MULTICALL_BYTES: ${{ needs.shipped-binaries.outputs.multicall_bytes }}
        run: |
          python3 -c "
          import json, os
          sizes = {
              'fallow': int(os.environ['FALLOW_BYTES']),
              'fallow-lsp': int(os.environ['FALLOW_LSP_BYTES']),
              'fallow-mcp': int(os.environ['FALLOW_MCP_BYTES']),
              'fallow-multicall': int(os.environ['FALLOW_MULTICALL_BYTES']),
          }
          data = [
              {'name': f'Binary Size ({name})', 'unit': 'bytes', 'value': size}
              for name, size in sizes.items()
          ]
          print(json.dumps(data, indent=2))
          " > bloat-bench.json

      - name: Store binary size metric
        uses: ./.github/actions/store-benchmark
        with:
          name: Fallow Binary Size
          tool: customSmallerIsBetter
          output-file-path: bloat-bench.json
          data-dir: bloat
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: ${{ github.event_name == 'pull_request' }}
