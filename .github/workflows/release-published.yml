# The other half of the curated-metadata gate that `release.yml` cannot run.
#
# `release.yml` is tag-last: it publishes every registry while the version tag
# is still absent, so the GitHub Release does not exist yet and its title and
# body cannot be read there. Publication is the first moment they exist. Assets,
# tag and target freeze at that point, but the title and body stay editable, so
# a failure here is repairable with `gh release edit --title` / `--notes-file`
# rather than merely informational.
name: Release Published

on:
  release:
    types: [published]

permissions: {}

jobs:
  release-metadata:
    name: Verify published release metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Checks out the default branch rather than the released tag. The release
      # commit lands on main before the tag exists, so main already carries the
      # released changelog section, and no event-controlled value reaches
      # `ref:`. The branch keeps moving while a release publishes, so the
      # script re-checks only that frozen section here, never pending work.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '26'

      - name: Verify curated release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --json name,body,isDraft,isPrerelease > release.json
          node scripts/verify-release-metadata.mjs \
            --tag "$TAG_NAME" \
            --release-json release.json

  # The published Action on a glibc Linux runner, with binary verification on.
  # The smoke jobs in `test-action.yml` set FALLOW_SKIP_BINARY_VERIFY, because
  # a pull request can carry a verifier that is newer than the published
  # packages. So this job is the only one that runs the verifier of the Action
  # against the packages that npm installs for the new release. With 3.43.0 the
  # verifier looked for the musl package on a glibc host, and no job failed
  # (issue #4591).
  action-smoke:
    name: Run the published Action on Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # No `version` input: the Action installs the latest published release,
      # as a workflow of a user does.
      - name: Run the Action with binary verification
        id: fallow
        uses: ./
        with:
          command: dead-code
          root: tests/fixtures/basic-project
          format: json
          fail-on-issues: false

      - name: Check the result and the installed version
        shell: bash
        env:
          RESULTS_PATH: ${{ steps.fallow.outputs.results }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          jq -e '.total_issues' "$RESULTS_PATH" > /dev/null
          installed="$(jq -r '.version' "$RESULTS_PATH")"
          if [ "v${installed}" != "$TAG_NAME" ]; then
            echo "::error::The Action installed fallow ${installed}, but the release is ${TAG_NAME}"
            exit 1
          fi
