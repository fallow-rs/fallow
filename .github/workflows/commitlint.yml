name: Commitlint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # The title and description steps read the event payload. An edit of either
    # must start a new run, because a re-run of a failed job keeps the old text.
    types: [opened, synchronize, reopened, edited]

permissions: {}

# Pull requests share one group per branch, so a new push or a title edit
# cancels the old run.
# A push to main gets one group per commit, so a main run is never cancelled or
# dropped while queued: the release gate reads the result for its own commit.
concurrency:
  group: commitlint-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install commitlint
        run: npm ci --ignore-scripts

      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run commitlint -- --verbose

      # Deferred work in a description must link a tracking issue, so it is
      # not lost after the merge. Bot pull requests carry generated text.
      - name: Check deferred work in the pull request description
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-pr-deferrals.mjs

      - name: Lint commit messages
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            npm run commitlint -- --from "$PR_BASE_SHA" --to HEAD --verbose
          elif [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            npm run commitlint -- --last --verbose
          else
            npm run commitlint -- --from "$BEFORE_SHA" --to HEAD --verbose
          fi
