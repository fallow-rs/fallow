name: CodeQL

# Static analysis for the Rust crates, the JavaScript and TypeScript tools and
# the workflows. It runs on GitHub-hosted runners, so it costs no paid minutes.
# The Analyze checks are not required checks, and findings show as code
# scanning alerts. The Rust analysis takes about 20 minutes, longer than CI on
# most pull requests, so it runs on pushes to main and on the schedule. A pull
# request analyzes Rust only when it changes the CodeQL configuration. A Rust
# alert then shows after the next analyzed push to main.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '45 4 * * 1'
  workflow_dispatch:

# A cancelled analysis uploads a failed run to code scanning, which shows as a
# configuration error. Let a started run finish. Pull requests and pushes to
# main share one group per ref, so a newer push replaces only the run that
# waits in the queue. Scheduled and manual runs get a group of their own.
concurrency:
  group: codeql-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  changes:
    name: Detect CodeQL configuration changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    # Only a pull request reads the filter. On other events the step skips,
    # the output is empty, and every leg analyzes, so a failed filter cannot
    # cost main its scan.
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            rust:
              - '.github/codeql/**'
              - '.github/workflows/codeql.yml'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    # The job always runs and only its steps skip, so each Analyze check
    # reports a result on every pull request.
    env:
      ANALYZE: ${{ matrix.language != 'rust' || github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Skip the Rust analysis
        if: env.ANALYZE != 'true'
        run: echo "Pull requests analyze Rust only when the CodeQL configuration changes. Pushes to main analyze Rust."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANALYZE == 'true'
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: env.ANALYZE == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: env.ANALYZE == 'true'
        with:
          category: /language:${{ matrix.language }}
