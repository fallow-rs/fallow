name: CodeQL

# Static analysis for the Rust crates, the JavaScript and TypeScript tools and
# the workflows. It runs on GitHub-hosted runners, so it costs no paid minutes.
# The Analyze checks are required on `main`, and findings show as code scanning
# alerts. The Rust analysis takes about 20 minutes, so a pull request that
# changes no Rust input skips its steps and the check passes at once. Pushes to
# main and the schedule always analyze.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '45 4 * * 1'
  workflow_dispatch:

# A cancelled analysis uploads a failed run to code scanning, which shows as a
# configuration error. Let a started run finish. A newer push replaces only the
# run that waits in the queue.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    # Only a pull request reads the filter. On other events the step skips,
    # the output is empty, and every leg analyzes, so a failed filter cannot
    # cost main its scan.
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/codeql/**'
              - '.github/workflows/codeql.yml'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    # A skipped job does not satisfy a required check, so the job always runs
    # and only its steps skip.
    env:
      ANALYZE: ${{ matrix.language != 'rust' || github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Skip the Rust analysis
        if: env.ANALYZE != 'true'
        run: echo "This pull request changes no Rust input, so the Rust analysis is skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANALYZE == 'true'
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: env.ANALYZE == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: env.ANALYZE == 'true'
        with:
          category: /language:${{ matrix.language }}
