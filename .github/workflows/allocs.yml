name: Allocation Tracking

# Runs on main and on demand. A pull request runs these jobs only when it
# carries the "ci:perf" label, to keep pull request jobs few. Add the label to
# get a result before merge. Without it, a change shows one commit later on main.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/allocs.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/allocs.yml'
  workflow_dispatch:

# Pull requests and ordinary pushes to main share one group per ref, so a
# newer run cancels the older one. Main gets many merges a day, and only the
# newest main commit needs a result. The release commit ("chore: release v")
# and manual or scheduled runs get a group of their own and are never
# cancelled: scripts/verify-release-ci.mjs reads the result for the release
# commit before a release can start.
# A "labeled" event for another label also gets a group of its own, so it
# does not cancel a real ci:perf run (its jobs skip).
concurrency:
  group: "allocs-${{ ((github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name != 'ci:perf')) || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v'))) && github.ref || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v')) }}"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  allocations:
    name: Allocation regression check
    runs-on: ubuntu-latest
    # On a pull request, run only with the "ci:perf" label. Skip a "labeled"
    # event for another label, so it does not start a second run.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:perf') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:perf'))
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: allocs

      - name: Run allocation benchmark
        run: cargo bench --bench allocations 2>&1 | tee alloc-output.txt

      - name: Parse allocations
        id: parse
        run: |
          total_bytes=$(grep '^alloc_total_bytes:' alloc-output.txt | awk '{print $2}')
          total_blocks=$(grep '^alloc_total_blocks:' alloc-output.txt | awk '{print $2}')
          max_bytes=$(grep '^alloc_max_bytes:' alloc-output.txt | awk '{print $2}')
          max_blocks=$(grep '^alloc_max_blocks:' alloc-output.txt | awk '{print $2}')

          {
            echo "## Allocation Stats"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Total bytes allocated | $total_bytes |"
            echo "| Total allocations | $total_blocks |"
            echo "| Peak memory (bytes) | $max_bytes |"
            echo "| Peak allocations | $max_blocks |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Write custom JSON for benchmark-action tracking
          python3 -c "
          import json
          data = [
            {'name': 'Total Bytes Allocated', 'unit': 'bytes', 'value': int('${total_bytes:-0}')},
            {'name': 'Total Allocations', 'unit': 'allocations', 'value': int('${total_blocks:-0}')},
            {'name': 'Peak Memory', 'unit': 'bytes', 'value': int('${max_bytes:-0}')},
            {'name': 'Peak Allocations', 'unit': 'allocations', 'value': int('${max_blocks:-0}')}
          ]
          print(json.dumps(data, indent=2))
          " > alloc-bench.json

      - name: Store allocation metrics
        if: always() && steps.parse.outcome != 'skipped'
        uses: ./.github/actions/store-benchmark
        with:
          name: Fallow Allocations
          tool: customSmallerIsBetter
          output-file-path: alloc-bench.json
          data-dir: allocs
          alert-threshold: '120%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          continue-on-error: ${{ github.event_name == 'pull_request' }}
