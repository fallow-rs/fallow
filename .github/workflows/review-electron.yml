name: Review Electron

on:
  push:
    branches: [main]
    paths:
      - 'apps/review-electron/**'
      - '.github/workflows/review-electron.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/review-electron/**'
      - '.github/workflows/review-electron.yml'
  workflow_dispatch:

concurrency:
  group: review-electron-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # A background git repack after a fixture commit races the next git add.
  # See scripts/workflow-policy.test.mjs.
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: gc.auto
  GIT_CONFIG_VALUE_1: '0'

jobs:
  test:
    name: Typecheck, lint, and test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/review-electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/review-electron/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download pinned Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test
