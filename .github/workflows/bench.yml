name: Benchmarks

# Runs on main and on demand. A pull request runs these jobs only when it
# carries the "ci:perf" label, to keep pull request jobs few. Add the label to
# get a result before merge. Without it, a change shows one commit later on main.
# Main runs keep the CodSpeed base results that a labeled pull request
# compares against.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'
      - '.github/actions/setup-rust/**'
      - '.github/scripts/generate-benchmark-matrix.mjs'
      - '.github/scripts/generate-benchmark-matrix.test.mjs'
      - 'scripts/check-benchmark-harness.py'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'
      - '.github/actions/setup-rust/**'
      - '.github/scripts/generate-benchmark-matrix.mjs'
      - '.github/scripts/generate-benchmark-matrix.test.mjs'
      - 'scripts/check-benchmark-harness.py'
  workflow_dispatch:

# Pull requests and ordinary pushes to main share one group per ref, so a
# newer run cancels the older one. Main gets many merges a day, and only the
# newest main commit needs a result. The release commit ("chore: release v")
# and manual or scheduled runs get a group of their own and are never
# cancelled: scripts/verify-release-ci.mjs reads the result for the release
# commit before a release can start.
# A "labeled" event for another label also gets a group of its own, so it
# does not cancel a real ci:perf run (its jobs skip).
concurrency:
  group: "bench-${{ ((github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name != 'ci:perf')) || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v'))) && github.ref || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v')) }}"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=1 -C strip=none -g --cfg codspeed"

jobs:
  benchmark-harness:
    name: Benchmark harness
    runs-on: ubuntu-latest
    # On a pull request, run only with the "ci:perf" label. Skip a "labeled"
    # event for another label, so it does not start a second run.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:perf') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:perf'))
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check benchmark harness drift
        run: python3 scripts/check-benchmark-harness.py

  determine-matrix:
    name: Determine benchmark matrix
    needs: benchmark-harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      fast_matrix: ${{ steps.matrix.outputs.fast_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine affected benchmark shards
        id: matrix
        env:
          BENCH_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          MATRIX=$(node .github/scripts/generate-benchmark-matrix.mjs)
          echo "fast_matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Fast benchmark matrix: $MATRIX"

  benchmark:
    name: CodSpeed fast simulation (${{ matrix.label }})
    needs:
      - benchmark-harness
      - determine-matrix
    if: needs.determine-matrix.outputs.fast_matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      # One rayon thread keeps simulated instruction counts stable: adaptive
      # work splitting on steals changes them between runs of the same code.
      RAYON_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.determine-matrix.outputs.fast_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-${{ matrix.cache_key }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-codspeed@4.7.0

      - name: Build benchmark shard
        # Keep PR feedback focused on deterministic API/session/cache paths.
        run: cargo codspeed build -p ${{ matrix.package }} --bench ${{ matrix.bench }} --features codspeed

      - name: Run benchmark shard
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: cargo codspeed run -p ${{ matrix.package }} --bench ${{ matrix.bench }}

  benchmark-full:
    name: CodSpeed full simulation (${{ matrix.label }})
    needs: benchmark-harness
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    env:
      # One rayon thread keeps simulated instruction counts stable: adaptive
      # work splitting on steals changes them between runs of the same code.
      RAYON_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: scaling analysis
            cache_key: full-scaling-analysis
            package: fallow-core
            bench: scaling_analysis
          - label: engine dupes pipeline
            cache_key: full-engine-dupes-pipeline
            package: fallow-engine
            bench: dupes_pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-${{ matrix.cache_key }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-codspeed@4.7.0

      - name: Build full benchmark shard
        # Full suites include audit/git-heavy and scaling paths that are useful but noisier.
        run: cargo codspeed build -p ${{ matrix.package }} --bench ${{ matrix.bench }} --features codspeed

      - name: Run full benchmark shard
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: cargo codspeed run -p ${{ matrix.package }} --bench ${{ matrix.bench }}
