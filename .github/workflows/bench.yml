name: Benchmarks

# Every CodSpeed job of the repository lives in this file. CodSpeed takes the
# results for one commit from one workflow run: a second workflow that uploads
# for the same commit gets the error "Benchmarks ran in several CI workflows".
# One run may carry simulation and walltime results.
#
# Main gets one full run each night, not one per merge. A pull request runs
# the simulation jobs only when it carries the "ci:perf" label. CodSpeed
# compares it with the latest main commit that has a run, so the comparison
# also holds the changes merged after that nightly run. A push to main runs
# the jobs only for the release commit ("chore: release v"), because
# scripts/verify-release-ci.mjs reads its result before a release. The
# walltime jobs run at night, on the release commit, on a dispatch with the
# walltime input, and once when a pull request gets the "ci:walltime" label.
# The "Perf label for cache formats" job runs on each pull request: it fails
# when the branch changes a benchmarked cache format without the label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'
      - '.github/actions/setup-rust/**'
      - '.github/scripts/generate-benchmark-matrix.mjs'
      - '.github/scripts/generate-benchmark-matrix.test.mjs'
      - 'scripts/check-benchmark-harness.py'
      - 'benchmarks/cli-instructions.sh'
      - 'tools/type-aware-sidecar/**'
      - 'scripts/check-perf-label.mjs'
      - 'scripts/check-version-bumps.mjs'
      - 'scripts/version-constants.mjs'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/bench.yml'
      - '.github/actions/setup-rust/**'
      - '.github/scripts/generate-benchmark-matrix.mjs'
      - '.github/scripts/generate-benchmark-matrix.test.mjs'
      - 'scripts/check-benchmark-harness.py'
      - 'benchmarks/cli-instructions.sh'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      walltime:
        description: Also run the walltime jobs on the macro runner
        type: boolean
        default: false

# Pull requests and ordinary pushes to main share one group per ref, so a
# newer run cancels the older one. Main gets many merges a day, and only the
# newest main commit needs a result. The release commit ("chore: release v")
# and manual or scheduled runs get a group of their own and are never
# cancelled: scripts/verify-release-ci.mjs reads the result for the release
# commit before a release can start.
# A "labeled" event for another label also gets a group of its own, so it
# does not cancel a real ci:perf run. A later push does not cancel the run of
# the "ci:walltime" label either.
concurrency:
  group: "bench-${{ ((github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name != 'ci:perf')) || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v'))) && github.ref || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v')) }}"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=1 -C strip=none -g --cfg codspeed"

jobs:
  benchmark-harness:
    name: Benchmark harness
    runs-on: ubuntu-26.04
    # Every benchmark job needs this job, so its condition decides whether the
    # run measures anything. On a pull request, run only with the "ci:perf"
    # label, and skip a "labeled" event for another label, so it does not
    # start a second run. The "labeled" event of "ci:walltime" also runs, for
    # the walltime jobs only, and only for a branch of this repository. On a
    # push, run only for the release commit.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore: release v')) ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci:perf') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:perf')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'ci:walltime' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check benchmark harness drift
        run: python3 scripts/check-benchmark-harness.py

  perf-label:
    name: Perf label for cache formats
    runs-on: ubuntu-26.04
    # Each pull request event, with or without the label: a change of a
    # benchmarked cache format without "ci:perf" fails here, and adding the
    # label starts a new run that passes.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # The check reads the commits of the branch that the base does not
      # contain, so it needs the full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Require ci:perf for a cache format change
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-perf-label.mjs --base "origin/$BASE_REF" --head "$HEAD_SHA" --labels-json "$LABELS"

  determine-matrix:
    name: Determine benchmark matrix
    needs: benchmark-harness
    # The run of the "ci:walltime" label measures walltime only. The fast
    # simulation shards need this job, so they skip too.
    if: github.event.label.name != 'ci:walltime'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      fast_matrix: ${{ steps.matrix.outputs.fast_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine affected benchmark shards
        id: matrix
        env:
          BENCH_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          MATRIX=$(node .github/scripts/generate-benchmark-matrix.mjs)
          echo "fast_matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Fast benchmark matrix: $MATRIX"

  benchmark:
    name: CodSpeed fast simulation (${{ matrix.label }})
    needs:
      - benchmark-harness
      - determine-matrix
    if: needs.determine-matrix.outputs.fast_matrix != '[]'
    # CodSpeed simulation currently rejects Ubuntu 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    # A cold build with two compile jobs takes longer than one with four.
    timeout-minutes: 45
    env:
      # One rayon thread keeps simulated instruction counts stable: adaptive
      # work splitting on steals changes them between runs of the same code.
      RAYON_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.determine-matrix.outputs.fast_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-${{ matrix.cache_key }}
          # Only the release push saves. A nightly cache is evicted before the
          # next night and pushes out the caches that pull requests restore.
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-codspeed@4.7.0

      - name: Add swap for the build
        # A cold build compiles several large crates at once with full debug
        # info. Without extra swap, a memory peak can stop the hosted runner
        # with exit code 143 and no compiler error (#4605). The temporary
        # disk at /mnt has the free space.
        run: bash scripts/ci-add-swap.sh /mnt/bench.swap 8

      - name: Build benchmark shard
        # Keep PR feedback focused on deterministic API/session/cache paths.
        # The resource log shows the cause when the runner stops mid-build.
        env:
          # Four parallel compiles of the large fallow crates, with full debug
          # info, use more than the 16 GB of the runner (#4605).
          CARGO_BUILD_JOBS: "2"
        run: bash scripts/ci-with-resource-log.sh cargo codspeed build -p ${{ matrix.package }} --bench ${{ matrix.bench }} --features codspeed

      - name: Run benchmark shard
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run -p ${{ matrix.package }} --bench ${{ matrix.bench }}
          # Charge each instruction the same cost. The cycle estimate uses the
          # cache model of the physical CPU, and the hosted runners change CPU
          # between runs, so the estimate moves on the same code.
          cycle-estimation: 'false'

  benchmark-full:
    name: CodSpeed full simulation (${{ matrix.label }})
    needs: benchmark-harness
    if: github.event_name != 'pull_request'
    # CodSpeed simulation currently rejects Ubuntu 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    env:
      # One rayon thread keeps simulated instruction counts stable: adaptive
      # work splitting on steals changes them between runs of the same code.
      RAYON_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: scaling analysis
            cache_key: full-scaling-analysis
            package: fallow-core
            bench: scaling_analysis
          - label: engine dupes pipeline
            cache_key: full-engine-dupes-pipeline
            package: fallow-engine
            bench: dupes_pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-${{ matrix.cache_key }}
          # Only the release push saves. A nightly cache is evicted before the
          # next night and pushes out the caches that pull requests restore.
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-codspeed@4.7.0

      - name: Add swap for the build
        # A cold build compiles several large crates at once with full debug
        # info. Without extra swap, a memory peak can stop the hosted runner
        # with exit code 143 and no compiler error (#4605). The temporary
        # disk at /mnt has the free space.
        run: bash scripts/ci-add-swap.sh /mnt/bench.swap 8

      - name: Build full benchmark shard
        # Full suites include audit/git-heavy and scaling paths that are useful but noisier.
        # The resource log shows the cause when the runner stops mid-build.
        env:
          # Four parallel compiles of the large fallow crates, with full debug
          # info, use more than the 16 GB of the runner (#4605).
          CARGO_BUILD_JOBS: "2"
        run: bash scripts/ci-with-resource-log.sh cargo codspeed build -p ${{ matrix.package }} --bench ${{ matrix.bench }} --features codspeed

      - name: Run full benchmark shard
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run -p ${{ matrix.package }} --bench ${{ matrix.bench }}
          # Charge each instruction the same cost. The cycle estimate uses the
          # cache model of the physical CPU, and the hosted runners change CPU
          # between runs, so the estimate moves on the same code.
          cycle-estimation: 'false'

  cli-instructions:
    name: CLI instruction counts
    # Whole-binary CPU simulation of the release CLI on pinned public projects.
    # benchmarks/cli-instructions.sh owns the corpus and the benchmark list.
    # The release push skips it to save runner time: the walltime-cli job
    # measures the release CLI on the same corpus for that commit.
    needs: benchmark-harness
    if: github.event_name != 'push' && github.event.label.name != 'ci:walltime'
    # CodSpeed simulation currently rejects Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      # The release CLI keeps its own release flags, not the bench flags.
      RUSTFLAGS: ""
      # Keep the symbol table so the CodSpeed flame graphs show function names.
      # Stripping does not change the instructions that the binary executes.
      CARGO_PROFILE_RELEASE_STRIP: none
      # The CPU simulation rejects a measured process that starts a child
      # process. With suggestions off, fallow starts no git probe for the next
      # steps. benchmarks/cli-instructions.sh has the full list of conditions.
      FALLOW_SUGGESTIONS: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-cli-instructions
          save-if: ${{ github.event_name == 'push' }}

      - name: Build fallow
        run: cargo build --release -p fallow-cli

      - name: Prepare the pinned corpus
        run: benchmarks/cli-instructions.sh prepare --fallow-bin target/release/fallow

      - name: Write the CodSpeed config
        run: benchmarks/cli-instructions.sh config --fallow-bin target/release/fallow > target/cli-instructions/codspeed.yml

      - name: Run the CPU simulation
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          config: target/cli-instructions/codspeed.yml
          # Charge each instruction the same cost, so the value follows the
          # instruction count and not the estimated cycles.
          cycle-estimation: 'false'

  # The walltime jobs run on a CodSpeed Macro Runner, a dedicated bare-metal
  # ARM64 (Graviton) machine. CodSpeed marks walltime from a shared
  # GitHub-hosted runner as unreliable. The CodSpeed Hobby plan of the
  # fallow-rs organization gives about 1,560 macro runner minutes per month.
  # A run uses about 4 of these minutes, so these jobs run at night, on the
  # release commit, on a dispatch with the walltime input, and on the
  # "labeled" event of "ci:walltime" on a branch of this repository. A fork
  # gets no OIDC token for the upload, and its code does not run on the
  # macro runner. A later push to the pull request does not start them
  # again, so each label event costs one run. The release
  # build runs on a free GitHub ARM64 runner. On the release commit, the
  # walltime jobs usually end before the slowest simulation shard, so the
  # release gate does not wait longer. A plain dispatch, such as the one of
  # scripts/verify-release-ci.mjs --dispatch-missing, never waits on a macro
  # runner.
  walltime-build-cli:
    name: Build fallow for the macro runner
    needs: benchmark-harness
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.walltime) ||
      (github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore: release v')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'ci:walltime' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    # The macro runner image is Ubuntu 22.04. A build on the same release keeps
    # the binary inside the glibc version of the runner.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTFLAGS: ""
      CARGO_PROFILE_RELEASE_STRIP: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-walltime-cli
          # Only the release push saves, as for the other benchmark caches.
          save-if: ${{ github.event_name == 'push' }}

      - name: Build fallow
        run: cargo build --release -p fallow-cli

      - name: Upload fallow binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-walltime-fallow
          path: target/release/fallow
          if-no-files-found: error
          retention-days: 1

  walltime-cli:
    name: CodSpeed walltime (CLI on pinned projects)
    needs: walltime-build-cli
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # The CLI runs the same commands as the CPU simulation job. With
      # suggestions off, fallow starts no git probe for the next steps.
      FALLOW_SUGGESTIONS: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-walltime-fallow
          path: target/release

      - name: Prepare the pinned corpus
        run: |
          chmod +x target/release/fallow
          benchmarks/cli-instructions.sh prepare --fallow-bin target/release/fallow

      - name: Write the CodSpeed config
        run: benchmarks/cli-instructions.sh config --fallow-bin target/release/fallow > target/cli-instructions/codspeed.yml

      - name: Run the walltime benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: walltime
          config: target/cli-instructions/codspeed.yml

  type-aware:
    name: CodSpeed walltime (type-aware cold and warm)
    needs: benchmark-harness
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.walltime) ||
      (github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore: release v')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'ci:walltime' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/type-aware-sidecar/package-lock.json

      - name: Install type-aware benchmark dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: tools/type-aware-sidecar

      - name: Run type-aware benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: walltime
          run: npm run bench --prefix tools/type-aware-sidecar
