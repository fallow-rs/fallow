# Isolated validation on standard GitHub runners. No Blacksmith allocation.
name: Blacksmith budget routing validation
on:
  push:
    branches: [perf/blacksmith-trial]
    paths: [.github/workflows/blacksmith-trial.yml]
permissions: {}
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      miri: ${{ steps.changes.outputs.miri }}
    steps:
      - id: changes
        run: echo 'miri=true' >> "$GITHUB_OUTPUT"

  miri-runner:
    name: Select Miri runner
    needs: changes
    if: >-
      vars.BLACKSMITH_MIRI_ALLOCATION != '' &&
      (needs.changes.outputs.miri == 'true' || github.event_name == 'push') &&
      github.repository == 'fallow-rs/fallow' && github.run_attempt == 1 &&
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.runner.outputs.runner }}
    steps:
      # The default branch owns allocation policy, including for internal PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Select within the reserved trial window
        id: runner
        continue-on-error: true
        env:
          BLACKSMITH_MIRI_ALLOCATION: ${{ vars.BLACKSMITH_MIRI_ALLOCATION }}
          MIRI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ ! -f scripts/select-miri-runner.mjs ]; then
            echo 'runner=ubuntu-latest' >> "$GITHUB_OUTPUT"
            echo 'Miri uses GitHub: the trusted allocation helper is not available yet.' >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/select-miri-runner.mjs
          fi
      - name: Report selector fallback
        if: steps.runner.outcome == 'failure'
        run: echo 'Miri uses GitHub because allocation selection failed.' >> "$GITHUB_STEP_SUMMARY"


  miri:
    name: Miri
    needs: [changes, miri-runner]
    # On pull requests, path-filtered to crates/{graph,extract,types,config}: catches
    # contributor PRs that add tempdir / fs-IO tests without inheriting
    # #[cfg_attr(miri, ignore)] from sibling tests. On push it always runs, so the
    # release commit has a Miri result. Release Validation does not run Miri.
    # The local pre-push hook checks formatting and Clippy, not Miri.
    if: always() && !cancelled() && (needs.changes.outputs.miri == 'true' || github.event_name == 'push')
    # Rerun-failed-jobs can retain the selector output from attempt one.
    runs-on: ${{ github.run_attempt == 1 && needs['miri-runner'].result == 'success' && needs['miri-runner'].outputs.runner == 'blacksmith-4vcpu-ubuntu-2404' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    # 60, not 45: the fallow-extract step shares this budget with types+graph and
    # the React/JSX structural-extraction additions (larger ModuleInfo + per-file
    # JSX harvesting) grew the extract suite's interpreter runtime past the old
    # 45-min ceiling. cargo test passes fast; this is Miri-interpreter cost only.
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MIRI_TOOLCHAIN: nightly-2026-03-20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 16c49ff5ea38e06fb57beafcf460bb3fcfe99f2b
          persist-credentials: false
      - name: Verify source and GitHub fallback
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          test "$(git rev-parse HEAD)" = "16c49ff5ea38e06fb57beafcf460bb3fcfe99f2b"
          test "$RUNNER_KIND" = github-hosted
      - name: Run allocation and workflow policy tests
        run: node --test scripts/select-miri-runner.test.mjs scripts/workflow-policy.test.mjs
