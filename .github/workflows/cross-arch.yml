name: Cross-Architecture

# Runs on main only, to keep pull request jobs few. A cross-target compile
# error shows one commit later on main, before a release can start.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/cross-arch.yml'
  workflow_dispatch:

# Pull requests and ordinary pushes to main share one group per ref, so a
# newer run cancels the older one. Main gets many merges a day, and only the
# newest main commit needs a result. The release commit ("chore: release v")
# and manual or scheduled runs get a group of their own and are never
# cancelled: scripts/verify-release-ci.mjs reads the result for the release
# commit before a release can start.
concurrency:
  group: "cross-arch-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v'))) && github.ref || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v')) }}"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cross-compile check (compilation only, no test execution)
  # Tests require the actual target OS, which is handled by ci.yml's matrix.
  # This job verifies the codebase compiles for additional architectures
  # beyond what ci.yml covers (e.g., aarch64 Linux for ARM servers/CI).
  # Windows is tested natively in ci.yml, so it's not cross-compiled here.
  # x86_64 Linux is the native target of the ci.yml check job, so it is not
  # repeated here.
  cross-compile:
    name: Compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: cross-${{ matrix.target }}

      - name: Install aarch64 cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # The runner image carries third-party apt sources this job never
          # installs from, and one of them serving a mismatched index fails
          # `apt-get update` for every source at once. Let the refresh report
          # and continue: apt still verifies and uses only what it fetched, and
          # the install below is the real gate, so a genuinely broken Ubuntu
          # index still fails the job loudly.
          sudo apt-get update || echo "apt-get update reported errors on at least one source"
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Check compilation
        run: cargo check --workspace --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
