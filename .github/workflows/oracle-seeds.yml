name: Oracle Seeds

# Runs the oracle tests over a wide range of generated inputs, once a day and
# on demand. An oracle test compares two runs that must agree, for example a
# warm cache run and a cache-free run. Pull request CI runs the same tests
# with fixed seeds only, so this workflow adds no pull request time. It does
# not run on push to main, so scripts/verify-release-ci.mjs does not need it
# in REQUIRED_WORKFLOWS, and a failure does not block a release.
#
# Each run searches new seed numbers: the first seed number moves by
# SEED_STRIDE with each run number. A failure prints the template and the
# steps of the failing sequence. Add that sequence to REGRESSIONS in the
# sequences.rs file of the cache model when you fix the cause: in
# crates/engine/tests/integration/cache_model for the analysis caches, and in
# crates/api/src/mutation/cache_model for the mutation result cache. A
# permutation oracle failure prints the template, the project seed and the
# permutation seed: add that pair as a fixed test in
# crates/cli/tests/integration/permutation/oracle.rs when you fix the cause.
# A Unicode span failure prints the shrunk input. Add it as a named test to
# the unicode_span_oracle module that failed.
# The platform oracle in crates/cli/tests/integration/platform prints the
# project seed and the line-ending form of a failing project.
# A surface differential failure prints the project seed and each fact on
# which the surfaces disagree. Add that seed to PR_SEEDS in
# crates/mcp/tests/integration/surface_differential/oracle.rs when you fix
# the cause.
on:
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'The number of seeds to run'
        type: number
        default: 400
      start:
        description: 'The first seed number (0: run number times SEED_STRIDE)'
        type: number
        default: 0
      mutation_seeds:
        description: 'The number of mutation result cache seeds to run'
        type: number
        default: 100
      mutation_start:
        description: 'The first mutation result cache seed number (0: run number times MUTATION_SEED_STRIDE)'
        type: number
        default: 0
      permutation_seeds:
        description: 'The number of permutation oracle project seeds to run'
        type: number
        default: 60
      permutation_start:
        description: 'The first permutation oracle project seed (0: run number times PERMUTATION_SEED_STRIDE)'
        type: number
        default: 0
      surface_seeds:
        description: 'The number of surface differential project seeds to run'
        type: number
        default: 100
      surface_start:
        description: 'The first surface differential project seed (0: run number times SURFACE_SEED_STRIDE)'
        type: number
        default: 0
      unicode_cases:
        description: 'The number of cases for each Unicode span test'
        type: number
        default: 20000
      unicode_seed:
        description: 'The Unicode span seed (0: the run number)'
        type: number
        default: 0
      platform_seeds:
        description: 'The number of platform oracle project seeds to run'
        type: number
        default: 40
      platform_start:
        description: 'The first platform oracle project seed (0: (run number - 1) times PLATFORM_SEED_STRIDE, plus 1)'
        type: number
        default: 0

concurrency:
  group: oracle-seeds
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  SEED_STRIDE: 400
  # Each mutation result cache seed runs the real test runner about ten
  # times, so its range is smaller.
  MUTATION_SEED_STRIDE: 100
  # Each permutation oracle seed runs the binary about 180 times (each
  # command and format, with and without the permutation).
  PERMUTATION_SEED_STRIDE: 60
  # Each surface differential seed runs the CLI, the MCP server, the
  # language server and the Node bindings about 60 times, in about 4 s.
  SURFACE_SEED_STRIDE: 100
  # The Unicode span tests parse small inputs, so one run checks many cases.
  UNICODE_SPAN_CASES: 20000
  # Each platform seed runs each command and format on two checkouts.
  PLATFORM_SEED_STRIDE: 40
  # A background git repack after a fixture commit races the next git add.
  # See scripts/workflow-policy.test.mjs.
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: gc.auto
  GIT_CONFIG_VALUE_1: '0'

jobs:
  cache-model-seeds:
    name: Cache model wide seed range
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: oracle-seeds

      - name: Build the cache model tests
        run: cargo test --locked -p fallow-engine --test integration cache_model --no-run

      - name: Run the wide seed range
        shell: bash
        env:
          INPUT_SEEDS: ${{ inputs.seeds }}
          INPUT_START: ${{ inputs.start }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          count="${INPUT_SEEDS:-$SEED_STRIDE}"
          start="${INPUT_START:-0}"
          case "$count:$start" in
            *[!0-9:]* | :* | *:) echo "::error::seeds and start must be whole numbers"; exit 2 ;;
          esac
          if [ "$count" -lt 1 ]; then
            echo "::error::seeds must be 1 or more"
            exit 2
          fi
          if [ "$start" = 0 ]; then
            start=$(( (RUN_NUMBER - 1) * SEED_STRIDE + 1 ))
          fi
          export FALLOW_CACHE_MODEL_SEEDS="$count"
          export FALLOW_CACHE_MODEL_SEED_START="$start"
          echo "Seed numbers $start to $(( start + count - 1 ))"
          status=0
          cargo test --locked -p fallow-engine --test integration cache_model::sequences::seed_sweep_matches_cache_free_runs \
            -- --ignored --exact 2>&1 | tee seeds.log || status=$?
          {
            echo "## Cache model wide seed range"
            echo
            echo "Seed numbers $start to $(( start + count - 1 )). Run again with \`FALLOW_CACHE_MODEL_SEED_START=$start FALLOW_CACHE_MODEL_SEEDS=$count\`."
            echo
            if [ "$status" = 0 ]; then
              echo "Each warm run matched the cache-free run."
            elif grep -q 'the warm run differs from the cache-free run' seeds.log; then
              echo "A warm run differs from the cache-free run. Add this sequence to \`REGRESSIONS\` when you fix the cause:"
              echo
              echo '```text'
              sed -n '/panicked at/,$p' seeds.log | head -80
              echo '```'
            else
              echo "The run failed before it compared a sequence. Read the log of this step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  mutation-cache-model-seeds:
    name: Mutation result cache model wide seed range
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: oracle-seeds-mutation

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.x'
          no-cache: true

      - name: Install mutation runner dependencies
        run: npm ci --prefix tools/mutation-runner --no-audit --no-fund --ignore-scripts

      - name: Build the mutation result cache model tests
        run: cargo test --locked -p fallow-api --lib --no-run

      - name: Run the wide seed range
        shell: bash
        env:
          INPUT_SEEDS: ${{ inputs.mutation_seeds }}
          INPUT_START: ${{ inputs.mutation_start }}
          RUN_NUMBER: ${{ github.run_number }}
          # A missing runner fails the run instead of a skip.
          FALLOW_MUTATION_E2E_REQUIRED: '1'
        run: |
          set -euo pipefail
          count="${INPUT_SEEDS:-$MUTATION_SEED_STRIDE}"
          start="${INPUT_START:-0}"
          case "$count:$start" in
            *[!0-9:]* | :* | *:) echo "::error::seeds and start must be whole numbers"; exit 2 ;;
          esac
          if [ "$count" -lt 1 ]; then
            echo "::error::seeds must be 1 or more"
            exit 2
          fi
          if [ "$start" = 0 ]; then
            start=$(( (RUN_NUMBER - 1) * MUTATION_SEED_STRIDE + 1 ))
          fi
          export FALLOW_MUTATION_CACHE_MODEL_SEEDS="$count"
          export FALLOW_MUTATION_CACHE_MODEL_SEED_START="$start"
          echo "Seed numbers $start to $(( start + count - 1 ))"
          status=0
          cargo test --locked -p fallow-api --lib mutation::cache_model::sequences::seed_sweep_matches_cache_free_runs \
            -- --ignored --exact 2>&1 | tee seeds.log || status=$?
          {
            echo "## Mutation result cache model wide seed range"
            echo
            echo "Seed numbers $start to $(( start + count - 1 )). Run again with \`FALLOW_MUTATION_CACHE_MODEL_SEED_START=$start FALLOW_MUTATION_CACHE_MODEL_SEEDS=$count\`."
            echo
            if [ "$status" = 0 ]; then
              echo "Each warm run matched the cache-free run."
            elif grep -q 'the warm run differs from the cache-free run' seeds.log; then
              echo "A warm run differs from the cache-free run. Add this sequence to \`REGRESSIONS\` when you fix the cause:"
              echo
              echo '```text'
              sed -n '/panicked at/,$p' seeds.log | head -80
              echo '```'
            else
              echo "The run failed before it compared a sequence. Read the log of this step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  permutation-seeds:
    name: Permutation oracle wide seed range
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: oracle-seeds-permutation

      - name: Build the permutation oracle tests
        run: cargo test --locked -p fallow-cli --test integration permutation::oracle --no-run

      - name: Run the wide seed range
        shell: bash
        env:
          INPUT_SEEDS: ${{ inputs.permutation_seeds }}
          INPUT_START: ${{ inputs.permutation_start }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          count="${INPUT_SEEDS:-$PERMUTATION_SEED_STRIDE}"
          start="${INPUT_START:-0}"
          case "$count:$start" in
            *[!0-9:]* | :* | *:) echo "::error::seeds and start must be whole numbers"; exit 2 ;;
          esac
          if [ "$count" -lt 1 ]; then
            echo "::error::seeds must be 1 or more"
            exit 2
          fi
          if [ "$start" = 0 ]; then
            start=$(( (RUN_NUMBER - 1) * PERMUTATION_SEED_STRIDE + 1 ))
          fi
          export FALLOW_PERMUTATION_SEEDS="$count"
          export FALLOW_PERMUTATION_SEED_START="$start"
          echo "Project seeds $start to $(( start + count - 1 ))"
          status=0
          cargo test --locked -p fallow-cli --test integration permutation::oracle::seed_sweep_keeps_output_identical \
            -- --ignored --exact --nocapture 2>&1 | tee seeds.log || status=$?
          {
            echo "## Permutation oracle wide seed range"
            echo
            echo "Project seeds $start to $(( start + count - 1 )). Run again with \`FALLOW_PERMUTATION_SEED_START=$start FALLOW_PERMUTATION_SEEDS=$count\`."
            echo
            if [ "$status" = 0 ]; then
              echo "No output changed with the discovery order."
            elif grep -q 'the output changes with the discovery order' seeds.log; then
              echo "An output changed with the discovery order:"
              echo
              echo '```text'
              sed -n '/panicked at/,$p' seeds.log | head -40
              echo '```'
            else
              echo "The run failed before it compared an output. Read the log of this step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  surface-differential-seeds:
    name: Surface differential wide seed range
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: oracle-seeds-surface

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # The test binary first, then the binaries that it runs.
      - name: Build the surface differential tests
        run: |
          cargo test --locked -p fallow-mcp --test integration surface_differential --no-run
          cargo build --locked -p fallow-cli -p fallow-lsp

      - name: Build the Node bindings
        run: |
          cd crates/napi
          npm ci --omit=optional --ignore-scripts
          npx napi build --platform --no-js
          npm run publish:prepare

      - name: Run the wide seed range
        shell: bash
        env:
          INPUT_SEEDS: ${{ inputs.surface_seeds }}
          INPUT_START: ${{ inputs.surface_start }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          count="${INPUT_SEEDS:-$SURFACE_SEED_STRIDE}"
          start="${INPUT_START:-0}"
          case "$count:$start" in
            *[!0-9:]* | :* | *:) echo "::error::seeds and start must be whole numbers"; exit 2 ;;
          esac
          if [ "$count" -lt 1 ]; then
            echo "::error::seeds must be 1 or more"
            exit 2
          fi
          if [ "$start" = 0 ]; then
            start=$(( (RUN_NUMBER - 1) * SURFACE_SEED_STRIDE + 1 ))
          fi
          export FALLOW_SURFACE_SEEDS="$count"
          export FALLOW_SURFACE_SEED_START="$start"
          export FALLOW_SURFACE_NODE_ADDON="$PWD/crates/napi"
          echo "Project seeds $start to $(( start + count - 1 ))"
          status=0
          cargo test --locked -p fallow-mcp --test integration surface_differential:: \
            -- --include-ignored --skip surface_differential::cache_env::api_child --nocapture 2>&1 | tee seeds.log || status=$?
          {
            echo "## Surface differential wide seed range"
            echo
            echo "Project seeds $start to $(( start + count - 1 )), with the Node bindings. Run again with \`FALLOW_SURFACE_SEED_START=$start FALLOW_SURFACE_SEEDS=$count\`."
            echo
            if [ "$status" = 0 ]; then
              echo "Each surface gave the same facts."
            elif grep -q 'the surfaces disagree' seeds.log; then
              echo "The surfaces disagree:"
              echo
              echo '```text'
              sed -n '/panicked at/,$p' seeds.log | head -60
              echo '```'
            else
              echo "A test failed before it compared the surfaces. Read the log of this step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  unicode-span-seeds:
    name: Unicode span wide case range
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: oracle-seeds-unicode

      - name: Build the Unicode span tests
        run: cargo test --locked -p fallow-lsp -p fallow-core -p fallow-extract -p fallow-cli --lib --no-run

      - name: Run the wide case range
        shell: bash
        env:
          INPUT_CASES: ${{ inputs.unicode_cases }}
          INPUT_SEED: ${{ inputs.unicode_seed }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cases="${INPUT_CASES:-$UNICODE_SPAN_CASES}"
          seed="${INPUT_SEED:-0}"
          case "$cases:$seed" in
            *[!0-9:]* | :* | *:) echo "::error::cases and seed must be whole numbers"; exit 2 ;;
          esac
          if [ "$cases" -lt 1 ]; then
            echo "::error::cases must be 1 or more"
            exit 2
          fi
          if [ "$seed" = 0 ]; then
            seed="$RUN_NUMBER"
          fi
          export PROPTEST_CASES="$cases"
          export PROPTEST_RNG_SEED="$seed"
          echo "Seed $seed, $cases cases for each test"
          status=0
          cargo test --locked -p fallow-lsp -p fallow-core -p fallow-extract -p fallow-cli -p fallow-engine --lib unicode_span_oracle \
            2>&1 | tee seeds.log || status=$?
          {
            echo "## Unicode span wide case range"
            echo
            echo "Seed $seed, $cases cases for each test. Run again with \`PROPTEST_RNG_SEED=$seed PROPTEST_CASES=$cases\`."
            echo
            if [ "$status" = 0 ]; then
              echo "Each Unicode span test passed."
            elif grep -q 'minimal failing input' seeds.log; then
              echo "A case failed. Add the shrunk input as a named test when you fix the cause:"
              echo
              echo '```text'
              sed -n '/Test failed/,/global rejects/p' seeds.log | head -80
              echo '```'
            else
              echo "A test failed without a shrunk input, or the build failed. Read the log of this step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  platform-seeds:
    name: Platform oracle wide seed range
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: oracle-seeds-platform

      - name: Build the platform oracle tests
        run: cargo test --locked -p fallow-cli --test integration --no-run

      - name: Run the wide seed range
        shell: bash
        env:
          INPUT_SEEDS: ${{ inputs.platform_seeds }}
          INPUT_START: ${{ inputs.platform_start }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          count="${INPUT_SEEDS:-$PLATFORM_SEED_STRIDE}"
          start="${INPUT_START:-0}"
          case "$count:$start" in
            *[!0-9:]* | :* | *:) echo "::error::seeds and start must be whole numbers"; exit 2 ;;
          esac
          if [ "$count" -lt 1 ]; then
            echo "::error::seeds must be 1 or more"
            exit 2
          fi
          if [ "$start" = 0 ]; then
            start=$(( (RUN_NUMBER - 1) * PLATFORM_SEED_STRIDE + 1 ))
          fi
          export FALLOW_PLATFORM_SEEDS="$count"
          export FALLOW_PLATFORM_SEED_START="$start"
          echo "Seed numbers $start to $(( start + count - 1 ))"
          status=0
          cargo test --locked -p fallow-cli --test integration platform::oracle::seed_sweep_keeps_findings_identical \
            -- --ignored --exact 2>&1 | tee seeds.log || status=$?
          {
            echo "## Platform oracle wide seed range"
            echo
            echo "Seed numbers $start to $(( start + count - 1 )). Run again with \`FALLOW_PLATFORM_SEED_START=$start FALLOW_PLATFORM_SEEDS=$count\`."
            echo
            if [ "$status" = 0 ]; then
              echo "Each CRLF and mixed form gave the same findings, fingerprints and baselines as the LF form."
            elif grep -q 'changes with the line endings' seeds.log; then
              echo "A form gives other output than the LF form. Add a fixed-seed test with this project seed and form when you fix the cause:"
              echo
              echo '```text'
              sed -n '/panicked at/,$p' seeds.log | head -80
              echo '```'
            else
              echo "The run failed before it compared a project. Read the log of this step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
