name: Ecosystem CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/ecosystem/**'
      - '.github/workflows/ecosystem.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/ecosystem/**'
      - '.github/workflows/ecosystem.yml'
  workflow_dispatch:

# Pull requests and ordinary pushes to main share one group per ref, so a
# newer run cancels the older one. Main gets many merges a day, and only the
# newest main commit needs a result. The release commit ("chore: release v")
# and manual or scheduled runs get a group of their own and are never
# cancelled: scripts/verify-release-ci.mjs reads the result for the release
# commit before a release can start.
concurrency:
  group: "ecosystem-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v'))) && github.ref || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v')) }}"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  FALLOW_QUIET: "1"

jobs:
  # Build the release binary once. The project jobs download it, so the five
  # projects do not each do a full LTO build and race for one cache key.
  build:
    name: Build fallow (release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout fallow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ecosystem

      - name: Build fallow (release)
        run: cargo build --release -p fallow-cli

      - name: Upload fallow binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-fallow-binary
          path: target/release/fallow
          if-no-files-found: error
          retention-days: 1

  ecosystem:
    name: Ecosystem (${{ matrix.project.name }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: vite
            repo: vitejs/vite
            ref: main
            path: packages/vite
          - name: create-t3-app
            repo: t3-oss/create-t3-app
            ref: main
            path: cli
          - name: next.js-with-typescript
            repo: vercel/next.js
            ref: canary
            path: examples/with-typescript
            sparse: examples/with-typescript
          - name: sveltekit-template
            repo: sveltejs/kit
            ref: main
            path: packages/create-svelte/templates/default
          - name: remix-indie-stack
            repo: remix-run/indie-stack
            ref: main
            path: .

    steps:
      - name: Download fallow binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecosystem-fallow-binary
          path: fallow-bin

      # Artifacts do not keep the file mode, so restore the execute bit.
      - name: Make fallow executable
        run: chmod +x fallow-bin/fallow

      - name: Clone target project
        env:
          PROJECT_REPO: ${{ matrix.project.repo }}
          PROJECT_REF: ${{ matrix.project.ref }}
          PROJECT_SPARSE: ${{ matrix.project.sparse }}
        run: |
          # Five third-party repositories are cloned per run, which makes
          # transient network and TLS errors the dominant failure mode. The
          # analysis step below is deliberately non-gating, so a blip while
          # fetching someone else's repository should not be the one thing
          # that turns this workflow red.
          clone_project() {
            if [ -n "$PROJECT_SPARSE" ]; then
              git clone --depth 1 --filter=blob:none --sparse \
                --branch "$PROJECT_REF" \
                "https://github.com/$PROJECT_REPO.git" \
                ecosystem-project
            else
              git clone --depth 1 \
                --branch "$PROJECT_REF" \
                "https://github.com/$PROJECT_REPO.git" \
                ecosystem-project
            fi
          }

          for attempt in 1 2 3; do
            if clone_project; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::could not clone $PROJECT_REPO after $attempt attempts"
              exit 1
            fi
            echo "clone attempt $attempt failed, retrying"
            rm -rf ecosystem-project
            sleep "$((attempt * 15))"
          done

          if [ -n "$PROJECT_SPARSE" ]; then
            cd ecosystem-project
            git sparse-checkout set "$PROJECT_SPARSE"
          fi

      - name: Run fallow dead-code
        # Never fail the workflow. This step monitors, it does not gate.
        continue-on-error: true
        env:
          PROJECT_NAME: ${{ matrix.project.name }}
          PROJECT_PATH: ${{ matrix.project.path }}
        run: |
          cd "ecosystem-project/$PROJECT_PATH"
          "$GITHUB_WORKSPACE/fallow-bin/fallow" dead-code --format json \
            > "$GITHUB_WORKSPACE/ecosystem-$PROJECT_NAME.json" 2>&1 || true

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-${{ matrix.project.name }}
          path: ecosystem-${{ matrix.project.name }}.json
          retention-days: 30
