  vscode-public-verify:
    name: Verify public VS Code registry targets
    needs: [vscode-prep, vscode-publish-marketplace, vscode-publish-open-vsx]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Download closed VSIX target artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fallow-vscode-targets
          path: vscode-targets

      - name: Verify exact public registry payloads
        run: node scripts/vscode-public-verify.mjs --artifact-dir vscode-targets

  release-ready:
    name: Release ready for signed tag
    needs: [publish-crates, npm-publish, vscode-public-verify, release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require the release tag to remain absent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          set +e
          tag_error="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" 2>&1
          )"
          tag_status=$?
          set -e
          if [ "$tag_status" -eq 0 ]; then
            echo "::error::Release tag ${TAG_NAME} appeared before the release workflow completed"
            exit 1
          fi
          if ! grep -qF "(HTTP 404)" <<<"$tag_error"; then
            printf '%s\n' "$tag_error"
            echo "::error::Could not prove that release tag ${TAG_NAME} remains absent"
            exit 1
          fi
          echo "Release workflow completed with ${TAG_NAME} still absent"
