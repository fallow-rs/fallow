name: PGO Validate

# Ship gate for profile-guided optimization (PGO) of the release binaries.
# The train job makes a profile with scripts/pgo-train.sh on x86_64 Linux, as
# release.yml does. The compare job builds fallow-multicall twice per leg, once
# without and once with that profile, and compares them on the held-out
# fixtures (query, vite, astro). The gate fails when the PGO geomean wall time
# on the Linux x64 leg is not at least 5% lower than base, or when a PGO binary
# is larger than its base binary. This compares the pull request with its own
# base build, which main cannot catch one commit later.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pgo-train.sh'
      - '.github/workflows/pgo-validate.yml'
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

concurrency:
  group: pgo-validate-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  train:
    name: Train PGO profile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The same container as the pgo-profile job in release.yml.
    container: rust:1.97.1-bullseye@sha256:33e0cd779c556a248ac05acabb695c1da0cffaccc1796da507451482ac94d277
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu
          components: llvm-tools
          cache-key: pgo-validate-instrumented

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Cache training fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmarks/fixtures/real-world
          key: pgo-train-fixtures-v1-${{ hashFiles('benchmarks/download-fixtures.mjs') }}

      - name: Fetch training fixtures
        shell: bash
        run: node benchmarks/download-fixtures.mjs --only preact,fastify,zod,vue-core,svelte

      # Per-target rustflags merge with .cargo/config.toml. Never set a global
      # RUSTFLAGS in this workflow.
      - name: Build instrumented multicall binary
        shell: bash
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu -p fallow-multicall
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Cprofile-generate=/tmp/pgo-raw

      - name: Train PGO profile
        shell: bash
        run: |
          scripts/pgo-train.sh \
            target/x86_64-unknown-linux-gnu/release/fallow-multicall \
            benchmarks/fixtures/real-world \
            pgo-profile/fallow.profdata
          echo "PGO profile: $(wc -c < pgo-profile/fallow.profdata) bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PGO profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pgo-validate-profile
          path: pgo-profile/fallow.profdata
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  compare:
    name: Compare (${{ matrix.target }})
    needs: train
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Keep the matrix small: macOS and Windows minutes cost more.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: fallow-multicall
            measure: true
            gate: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: fallow-multicall
            measure: true
            gate: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: fallow-multicall
            measure: true
            gate: false
          # Build only: proves that the profile flag and the /STACK flag link.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: fallow-multicall.exe
            measure: false
            gate: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: pgo-validate-${{ matrix.target }}

      - name: Download PGO profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pgo-validate-profile
          path: target/pgo-profile

      # The same mechanism as release.yml: a per-target rustflags value in a
      # `--config` file, which Cargo merges with .cargo/config.toml. The file
      # name holds the profile hash, so a restored Cargo cache cannot reuse
      # crates that an older profile built.
      - name: Resolve PGO build flags
        shell: bash
        env:
          FALLOW_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dir="${GITHUB_WORKSPACE}/target/pgo-profile"
          if command -v cygpath >/dev/null 2>&1; then
            dir="$(cygpath -m "$dir")"
          fi
          if [ ! -s "$dir/fallow.profdata" ]; then
            echo "::error::PGO profile is missing or empty"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$dir/fallow.profdata" | cut -c1-16)"
          else
            digest="$(shasum -a 256 "$dir/fallow.profdata" | cut -c1-16)"
          fi
          profile="$dir/fallow-${digest}.profdata"
          mv "$dir/fallow.profdata" "$profile"
          printf "[target.%s]\nrustflags = ['-Cprofile-use=%s']\n" "$FALLOW_TARGET" "$profile" > "$dir/pgo.toml"
          cat "$dir/pgo.toml"

      - name: Build base binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p fallow-multicall --target-dir target/pgo-base

      - name: Build PGO binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p fallow-multicall --target-dir target/pgo-use --config target/pgo-profile/pgo.toml

      - name: Check binaries
        shell: bash
        env:
          FALLOW_TARGET: ${{ matrix.target }}
          FALLOW_BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          base="target/pgo-base/${FALLOW_TARGET}/release/${FALLOW_BINARY}"
          pgo="target/pgo-use/${FALLOW_TARGET}/release/${FALLOW_BINARY}"
          if cmp -s "$base" "$pgo"; then
            echo "::error::The PGO binary is identical to the base binary"
            exit 1
          fi
          if grep -qa LLVM_PROFILE_FILE "$pgo"; then
            echo "::error::The PGO binary contains the LLVM profiler runtime"
            exit 1
          fi
          "$pgo" --version
          base_bytes=$(wc -c < "$base" | tr -d ' ')
          pgo_bytes=$(wc -c < "$pgo" | tr -d ' ')
          echo "Binary size (${FALLOW_TARGET}): base ${base_bytes} bytes, PGO ${pgo_bytes} bytes" >> "$GITHUB_STEP_SUMMARY"
          if [ "$pgo_bytes" -gt "$base_bytes" ]; then
            echo "::error::The PGO binary is larger than the base binary"
            exit 1
          fi

      # The Windows binary must keep the 16 MiB main-thread stack from
      # .cargo/config.toml. Read SizeOfStackReserve from the PE32+ header.
      - name: Verify Windows stack reserve
        if: runner.os == 'Windows'
        shell: bash
        env:
          FALLOW_TARGET: ${{ matrix.target }}
          FALLOW_BINARY: ${{ matrix.binary }}
        run: |
          # shellcheck disable=SC2016 # The single quotes hold a JavaScript program.
          node -e '
            const bytes = require("node:fs").readFileSync(process.argv[1]);
            const optionalHeader = bytes.readUInt32LE(0x3c) + 24;
            if (bytes.readUInt16LE(optionalHeader) !== 0x20b) throw new Error("not a PE32+ binary");
            const reserve = bytes.readBigUInt64LE(optionalHeader + 72);
            console.log(`SizeOfStackReserve: ${reserve}`);
            if (reserve !== 16777216n) throw new Error("the /STACK:16777216 flag is missing");
          ' "target/pgo-use/${FALLOW_TARGET}/release/${FALLOW_BINARY}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.measure
        with:
          node-version: '22'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.measure
        with:
          version: 9

      - name: Cache held-out fixtures
        if: matrix.measure
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmarks/fixtures/real-world
          key: pgo-heldout-fixtures-v1-${{ runner.os }}-${{ hashFiles('benchmarks/download-fixtures.mjs') }}

      - name: Fetch held-out fixtures
        if: matrix.measure
        run: node benchmarks/download-fixtures.mjs --only query,vite,astro

      # Instruction counts need perf and a readable PMU. When the runner has
      # neither, the summary shows n/a and the gate uses wall time only.
      - name: Install perf
        if: matrix.measure && runner.os == 'Linux'
        id: perf
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-tools-$(uname -r)" linux-tools-common
          sudo sysctl -w kernel.perf_event_paranoid=1
          perf stat -e instructions:u true

      - name: Compare base and PGO
        if: matrix.measure
        env:
          FALLOW_TARGET: ${{ matrix.target }}
          FALLOW_BINARY: ${{ matrix.binary }}
          PGO_GATE: ${{ matrix.gate }}
          PERF_READY: ${{ steps.perf.outcome }}
        run: |
          set -euo pipefail
          args=(
            --base "target/pgo-base/${FALLOW_TARGET}/release/${FALLOW_BINARY}"
            --pgo "target/pgo-use/${FALLOW_TARGET}/release/${FALLOW_BINARY}"
            --fixtures benchmarks/fixtures/real-world
            --projects 'query,vite,astro'
            --commands 'check,dupes,health'
            --rounds 7
            --title "PGO comparison (${FALLOW_TARGET})"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [ "$PERF_READY" = "success" ]; then
            args+=(--perf)
          fi
          if [ "$PGO_GATE" = "true" ]; then
            args+=(--min-gain 0.05)
          fi
          node .github/scripts/pgo-compare.mjs "${args[@]}"
