name: Setup Rust
description: Install Rust toolchain and configure build caching

inputs:
  toolchain:
    description: 'Rust toolchain to install (stable, nightly, 1.96.0, etc.). When empty, reads rust-toolchain.toml from the repo root.'
    default: ''
  components:
    description: 'Comma-separated components (e.g., clippy, rustfmt)'
    default: ''
  targets:
    description: 'Comma-separated compilation targets'
    default: ''
  cache-key:
    description: 'Extra cache key to differentiate cache entries'
    default: ''
  shared-key:
    description: 'Cache key shared by jobs that build the same profile and features. When set, it replaces the per-job part of the cache key.'
    default: ''
  save-if:
    description: 'Save the cache only when this is "true". When empty, only pushes to main save, and every other run only restores.'
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve toolchain
      id: resolve
      shell: bash
      env:
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        if [ -n "$INPUT_TOOLCHAIN" ]; then
          echo "toolchain=$INPUT_TOOLCHAIN" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -f rust-toolchain.toml ]; then
          channel=$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ {print $2; exit}' rust-toolchain.toml)
          if [ -n "$channel" ]; then
            echo "toolchain=$channel" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        echo "toolchain=stable" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      with:
        toolchain: ${{ steps.resolve.outputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # Pull request runs restore the main cache and do not save. A pull request
    # cache only serves that one pull request, and many of them push the main
    # caches out of the repository cache quota.
    - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      with:
        key: ${{ inputs.cache-key }}
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if == 'true' || (inputs.save-if == '' && github.ref == 'refs/heads/main') }}
