name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What's the use case?
      placeholder: "I have a monorepo with custom entry points that fallow doesn't detect..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about.
    validations:
      required: false

  - type: dropdown
    id: usage
    attributes:
      label: How did you run fallow?
      description: Reports from coding agents show where the output, flags or docs are unclear.
      options:
        - Myself (terminal, editor or CI)
        - Through a coding agent (CLI, MCP server or skill)
    validations:
      required: false

  - type: textarea
    id: agent
    attributes:
      label: Agent behavior
      description: If a coding agent ran fallow, what did the agent expect, and what did it do? Include the command it ran.
      placeholder: "The agent ran `fallow dead-code --format json` and read `unused_exports` as a list of files."
    validations:
      required: false
