[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "3.40.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/fallow-rs/fallow"
homepage = "https://fallow.tools/docs/"
documentation = "https://fallow.tools/docs/"
keywords = ["typescript", "javascript", "lint", "static-analysis", "code-quality"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
fallow-api = { version = "3.40.0", path = "crates/api" }
fallow-core = { version = "3.40.0", path = "crates/core" }
fallow-config = { version = "3.40.0", path = "crates/config" }
fallow-extract = { version = "3.40.0", path = "crates/extract" }
fallow-engine = { version = "3.40.0", path = "crates/engine" }
fallow-graph = { version = "3.40.0", path = "crates/graph" }
fallow-mutation = { version = "3.40.0", path = "crates/mutation" }
fallow-output = { version = "3.40.0", path = "crates/output" }
fallow-process = { version = "3.40.0", path = "crates/process" }
fallow-report-protocol = { version = "3.40.0", path = "crates/report-protocol" }
fallow-security = { version = "3.40.0", path = "crates/security" }
fallow-types = { version = "3.40.0", path = "crates/types" }

# Parsing & analysis
oxc_allocator = "0.157"
oxc_ast = "0.157"
oxc_ast_visit = "0.157"
oxc_parser = "0.157"
oxc_resolver = { version = "11", features = ["yarn_pnp"] }
oxc_semantic = "0.157"
oxc_span = "0.157"
oxc_str = "0.157"
oxc_syntax = "0.157"
oxc_coverage_instrument = "0.20.0"
# CSS AST parser (browser-grade, built on Mozilla cssparser/selectors). Pinned
# exact because it has no stable release line and pre-release semver matching is
# brittle. Used by fallow-extract for CSS class/import extraction and analytics.
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = [
    "visitor",
] }
# Pinned exact in lockstep with lightningcss above: lightningcss types its
# public `Parse` trait against `cssparser` without re-exporting the crate, so
# this pin must equal the version lightningcss resolves. A newer `cssparser`
# gives two incompatible copies of the trait and the extractor stops compiling.
cssparser = "=0.37.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
# `rc` here and `chrono04` on schemars match the features that rmcp
# (fallow-mcp) enables. A package-scoped build such as `cargo build -p
# fallow-cli` then resolves the same feature set as a workspace build, and a
# switch between the two does not rebuild the dependents.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
deser-value = "0.10"
deser-yaml = "0.10"
semver = "1"
jsonc-parser = { version = "0.34", features = ["cst", "serde", "serde_json"] }
toml = "1.1"
toml_edit = "0.25"
schemars = { version = "1", features = ["chrono04"] }
flate2 = "1"

# Parallelism
rayon = "1"
dashmap = "6"

# File system
dunce = "1"
ignore = "0.4"
glob = "0.3"
globset = { version = "0.4", features = ["serde1"] }
rustix = { version = "1", features = ["event", "fs", "process"] }

# Allocator for the musl binaries (musl malloc is slow under threads)
mimalloc = { version = "0.1.52", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.11"
rustc-hash = "2"

# HTTP
httpdate = "1"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

# Caching
bitcode = "0.6"

# Diagnostics & output
colored = "3"
indicatif = "0.18"
miette = { version = "7" }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Graph
fixedbitset = "0.5"

# Persisted graph cache serialization (postcard is already pulled in transitively
# by oxc-browserslist; pin it directly so the persisted-graph-cache store uses a
# stable, alloc-backed binary format).
postcard = { version = "1", default-features = false, features = ["alloc"] }

# LSP
ls-types = "0.0.6"
tower-lsp-server = "0.23"
# `io-util` and `net` match the features that rmcp (fallow-mcp) enables; see the serde note.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "net", "process", "signal", "time"] }
tokio-util = { version = "0.7", default-features = false }

# File watching
notify = "8"

# Browser
open = "5"

# Testing
criterion = { package = "codspeed-criterion-compat", version = "=4.7.0", default-features = false }
insta = { version = "1", features = ["yaml"] }
jsonschema = { version = "0.60", default-features = false }
proptest = "1"
tempfile = "3"
libc = "0.2"

# Windows-only Win32 bindings (process query, job objects, and console signal handling)
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Globalization"] }

# Signal handling (Unix-only; Windows uses windows-sys::SetConsoleCtrlHandler directly)
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }

[workspace.lints.clippy]
# Lint groups (priority -1 so individual overrides take precedence)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restriction lints, catch common mistakes and enforce discipline
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"              # Force Arc::clone() / Rc::clone() explicitness
empty_drop = "warn"                     # Catch no-op Drop impls
empty_structs_with_brackets = "warn"    # Use `struct Foo;` not `struct Foo {}`
exit = "warn"                           # Prevent silent process::exit()
get_unwrap = "warn"                     # Prefer .get() over [] indexing
unwrap_used = "warn"                    # Require explicit justification for panic-prone unwrap()
expect_used = "warn"                    # Require explicit justification for panic-prone expect()
rc_buffer = "warn"                      # Prevent Rc<Vec<T>> anti-pattern
rc_mutex = "warn"                       # Prevent Rc<Mutex<T>> anti-pattern
undocumented_unsafe_blocks = "warn"     # All unsafe must have SAFETY comment
unnecessary_safety_comment = "warn"     # No pointless SAFETY comments on safe code
unused_result_ok = "warn"              # Don't silently ignore Result::ok()
infinite_loop = "warn"                  # Catch infinite loops without break
self_named_module_files = "warn"        # Prefer mod.rs style
pathbuf_init_then_push = "warn"         # Use PathBuf::from() directly
excessive_nesting = "warn"              # Catch deeply nested control flow (threshold in .clippy.toml)
allow_attributes_without_reason = "warn" # Force reason on #[allow] to catch unjustified suppressions
allow_attributes = "warn"               # Use #[expect], so a stale suppression fails CI
unimplemented = "warn"                  # Catch leftover unimplemented!() calls
filetype_is_file = "warn"               # FileType::is_file() misses symlinks, use !is_dir()
rest_pat_in_fully_bound_structs = "warn" # Catch `..` in patterns where all fields are already bound
pub_underscore_fields = "warn"           # Catch accidentally public _-prefixed fields
non_zero_suggestions = "warn"            # Suggest NonZero types for naturally non-zero values
precedence_bits = "warn"                 # Catch bitwise operator precedence mistakes
map_with_unused_argument_over_ranges = "warn" # Use `repeat`/`repeat_with` instead
iter_on_single_items = "warn"          # Catch iterator use where a direct call is clearer
redundant_clone = "warn"               # Catch avoidable clones before they reach hot paths
significant_drop_in_scrutinee = "warn" # Catch temporaries dropped later than expected
suspicious_operation_groupings = "warn" # Catch visually ambiguous arithmetic/bitwise grouping
unused_peekable = "warn"               # Catch Peekable iterators that never peek

# Restriction lints with few or no hits; they keep new code from regressing.
mem_forget = "warn"                     # Leaks destructors; use ManuallyDrop
lossy_float_literal = "warn"            # Literal that f32/f64 cannot represent
mixed_read_write_in_expression = "warn" # Unspecified evaluation order
try_err = "warn"                        # Err(x)? hides the return type
fn_to_numeric_cast_any = "warn"         # Function pointer cast to an integer
float_cmp_const = "warn"                # Exact compare against a float constant
string_lit_chars_any = "warn"           # Use matches! on a char instead
format_push_string = "warn"             # Use write! instead of a temporary String
mutex_atomic = "warn"                   # Use an atomic for a single primitive
suspicious_xor_used_as_pow = "warn"     # 2 ^ 8 is XOR, not a power
empty_enum_variants_with_brackets = "warn" # Use `Variant` not `Variant {}`
multiple_unsafe_ops_per_block = "warn"  # One SAFETY comment per unsafe operation
unwrap_in_result = "warn"               # Return the error instead of panicking
string_add = "warn"                     # Use push_str or format!
redundant_type_annotations = "warn"     # Annotation repeats the initializer type
deref_by_slicing = "warn"               # Use &* or as_slice() instead of [..]

# Process-spawn ban (method list lives in .clippy.toml). Allowed workspace-wide
# so CLI and MCP can spawn worktrees, sidecars, and subprocesses off the core
# analysis path. Core, extract, graph, and engine re-deny it at their crate
# roots; engine-owned Git wrappers carry narrow expectations at their call sites.
# The list also bans raw `glob::glob`; the config crate re-denies it as well.
disallowed_methods = "allow"

# Allow common pedantic false positives
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
too_many_lines = "warn"                 # SIG unit size, threshold in .clippy.toml
items_after_statements = "allow"
single_match_else = "allow"
redundant_closure_for_method_calls = "allow"
similar_names = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"                  # False positives on technical terms
too_long_first_doc_paragraph = "allow"  # Too strict for module-level docs
struct_excessive_bools = "allow"        # CLI filter structs need many bools
fn_params_excessive_bools = "allow"     # Same reason

# Allow nursery lints that are too noisy or have false positives
option_if_let_else = "allow"            # Too many false positives in match-heavy code
missing_const_for_fn = "allow"          # Not a const library
fallible_impl_from = "allow"            # From impls that can fail are intentional
use_self = "allow"                      # Too noisy with generics
unused_async_trait_impl = "allow"       # Trait signatures (tower-lsp, rmcp) require async fn without .await
assert_is_empty = "allow"               # The assert_eq! form needs `[] as [T; 0]` for most collections

# Allow cargo lints that are unavoidable
multiple_crate_versions = "allow"       # Transitive dependency version conflicts

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn" # Prefer crate/self/super paths inside crates
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri)', 'cfg(fuzzing)'] }
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"         # Require unsafe blocks even inside unsafe fn
unused_unsafe = "warn"                  # Catch unnecessary unsafe blocks
non_ascii_idents = "warn"              # Prevent non-ASCII identifiers
unit_bindings = "warn"                 # Catch useless `let _ = expr` bindings
tail_expr_drop_order = "warn"          # Catch temporaries dropped in surprising order

# cargo-fallow checks the Rust workspace: `cargo fallow check`. The CI job
# "Rust Structure" and the hk hooks run it. See
# docs/development/quality-gates.md#rust-structure.
[workspace.metadata.fallow.boundaries.groups]
foundation = [
    "fallow-report-protocol",
    "fallow-types",
    "fallow-config",
    "fallow-extract",
    "fallow-graph",
    "fallow-security",
    "fallow-core",
    "fallow-engine",
    "fallow-output",
    "fallow-process",
    "fallow-mutation",
    "fallow-api",
]
protocol = ["fallow-cli", "fallow-lsp", "fallow-mcp", "fallow-node"]
analysis-starters = ["fallow-core", "fallow-engine", "fallow-api"]

[[workspace.metadata.fallow.boundaries.crates]]
rule = "process-must-remain-independent"
from = ["fallow-process"]
deny = ["*"]

[[workspace.metadata.fallow.boundaries.crates]]
rule = "report-protocol-must-remain-independent"
from = ["fallow-report-protocol"]
deny = ["*"]

[[workspace.metadata.fallow.boundaries.crates]]
rule = "mutation-must-remain-independent"
from = ["fallow-mutation"]
deny = ["*"]

[[workspace.metadata.fallow.boundaries.crates]]
rule = "foundation-must-not-depend-on-protocol"
from = ["@foundation"]
deny = ["@protocol"]

[[workspace.metadata.fallow.boundaries.crates]]
rule = "output-must-not-start-analysis"
from = ["fallow-output"]
deny = ["@analysis-starters"]

# fallow-core is the backend of fallow-engine. The fallow-core entry in
# crates/engine/Cargo.toml has the one suppression of this rule.
[[workspace.metadata.fallow.boundaries.crates]]
rule = "only-engine-depends-on-core"
from = ["*"]
deny = ["fallow-core"]

[[workspace.metadata.fallow.boundaries.crates]]
rule = "api-consumers-use-api"
from = ["fallow-lsp", "fallow-mcp", "fallow-node"]
deny = ["fallow-engine", "fallow-cli", "fallow-core"]

[[workspace.metadata.fallow.boundaries.crates]]
rule = "types-does-not-depend-upward"
from = ["fallow-types"]
deny = ["fallow-config", "fallow-output", "fallow-api", "fallow-engine", "fallow-cli", "fallow-core"]

[[workspace.metadata.fallow.boundaries.crates]]
rule = "config-and-security-do-not-depend-upward"
from = ["fallow-config", "fallow-security"]
deny = ["fallow-output", "fallow-api", "fallow-engine", "fallow-cli", "fallow-core"]

[[workspace.metadata.fallow.boundaries.crates]]
rule = "engine-does-not-depend-on-api"
from = ["fallow-engine"]
deny = ["fallow-api"]

[[workspace.metadata.fallow.boundaries.reexports]]
rule = "explicit-type-reexports"
from = ["fallow-engine", "fallow-api"]
deny = ["fallow_types::extract", "fallow_types::results", "fallow_types::output_dead_code"]

# Each Oxc parse of user source runs inside `fallow_extract::parse_bounded`.
# That function sizes the stack from the source, so deep nesting cannot
# overflow it. A new parser call, also in a listed file, needs a decision:
# wrap it in `parse_bounded`, then raise `max`. An entry with `require` wraps
# its calls in `parse_bounded` itself. In an entry without `require`, the call
# runs only inside the bounded parse of a whole file. css_metrics.rs calls the
# CSS parser, which does not take source text.
[[workspace.metadata.fallow.boundaries.sources]]
rule = "parse-through-parse-bounded"
paths = ["crates"]
deny = ["Parser::new("]
scope = "production"
message = "{path} calls a parser outside the listed sites. Run the parse inside fallow_extract::parse_bounded, then add the file to the allow list of this rule in Cargo.toml"
allow = [
    { path = "crates/core/src/plugins/config_parser.rs", max = 1, require = ["parse_bounded("] },
    { path = "crates/engine/src/duplication_detector/tokenize/mod.rs", max = 4, require = ["parse_bounded("] },
    { path = "crates/engine/src/search_visibility.rs", max = 2, require = ["parse_bounded("] },
    { path = "crates/extract/src/alchemy.rs", max = 1 },
    { path = "crates/extract/src/astro/mod.rs", max = 3 },
    { path = "crates/extract/src/css_in_js/object.rs", max = 1, require = ["parse_bounded("] },
    { path = "crates/extract/src/css_metrics.rs", max = 1 },
    { path = "crates/extract/src/federation_runtime.rs", max = 1 },
    { path = "crates/extract/src/inventory.rs", max = 1, require = ["parse_bounded("] },
    { path = "crates/extract/src/mdx.rs", max = 1 },
    { path = "crates/extract/src/nesting.rs", max = 1, require = ["parse_bounded("] },
    { path = "crates/extract/src/parse.rs", max = 2 },
    { path = "crates/extract/src/sfc.rs", max = 2 },
    { path = "crates/extract/src/sfc_template/component_contracts.rs", max = 1 },
    { path = "crates/extract/src/similar_code.rs", max = 1, require = ["parse_bounded("] },
    { path = "crates/extract/src/template_usage.rs", max = 3 },
    # fallow-mutation has no fallow dependencies. The engine calls it only
    # inside parse_bounded (crates/engine/src/mutation/layout.rs).
    { path = "crates/mutation/src/lib.rs", max = 1 },
]

# The Miri CI job is slow and has a path filter. This rule finds a test path
# that the Miri build does not compile before the code reaches main.
[[workspace.metadata.fallow.boundaries.cfg]]
rule = "miri-build-compiles"
builds = [["test"], ["test", "miri"]]

[[workspace.metadata.fallow.boundaries.sources]]
rule = "semantic-client-owned-by-api"
paths = ["crates/cli/src", "crates/lsp/src", "crates/mcp/src", "crates/napi/src"]
deny = [
    "struct SemanticRequest",
    "struct SemanticResponse",
    "fn validate_response",
    "fn apply_api_surface",
    "fn run_semantic_request",
]
owner = "fallow-api"

[[workspace.metadata.fallow.boundaries.sources]]
rule = "process-tree-owned-by-process-crate"
paths = ["crates/cli/src", "crates/lsp/src", "crates/mcp/src", "crates/napi/src"]
deny = [
    "process_group(0)",
    "TerminateJobObject",
    "AssignProcessToJobObject",
    "CreateJobObjectW",
    "CREATE_SUSPENDED",
    "JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE",
    "libc::waitid",
]
owner = "fallow-process"

# Cargo resolves features for each build. When another member turns on a
# feature of a crate that fallow-cli also uses, `cargo build -p fallow-cli`
# and `cargo build --workspace` compile two variants of that crate. The fix is
# a feature-only entry in crates/cli/Cargo.toml.
[workspace.metadata.fallow.deps]
unify-features = ["fallow-cli"]

[workspace.metadata.fallow.visibility]
production = [
    "fallow-cli:fallow",
    "fallow-lsp:fallow-lsp",
    "fallow-mcp:fallow-mcp",
    "fallow-multicall:fallow-multicall",
]
uniform-fields = true
# Only these libraries are a Rust API for other repositories. cargo-fallow
# reads fallow-report-protocol, and the coverage sidecar reads fallow-license
# and fallow-v8-coverage. The other published crates exist because a published
# crate depends on them, so each rule applies to them.
public-crates = [
    "fallow-api",
    "fallow-types",
    "fallow-output",
    "fallow-config",
    "fallow-report-protocol",
    "fallow-license",
    "fallow-v8-coverage",
]

# `max-function-lines` and `max-cognitive` are the same limits as
# `too-many-lines-threshold` and `cognitive-complexity-threshold` in
# .clippy.toml. cargo-fallow-baseline.json holds the functions that were over
# a complexity limit when the gate started.
[workspace.metadata.fallow.size]
max-file-lines = 2000
max-function-lines = 100

# `flat-match` counts a `match` with no guard and no decision in an arm, for
# example a lookup table, as one decision.
[workspace.metadata.fallow.complexity]
max-cognitive = 25
max-cyclomatic = 20
cyclomatic-policy = "flat-match"

# Rust code has many small clone groups, and a baseline of each group goes
# stale on each edit. The percentage gate stops the total from growing, so
# the rule is off and only the gate reports. `production` leaves test code
# out, so test duplication cannot hide a rise in production duplication.
[workspace.metadata.fallow.dupes]
threshold = 4.9
production = true

[workspace.metadata.fallow.rules]
code-duplication = "off"

# Dev profile: disable debug info for faster builds
[profile.dev]
debug = false

[profile.test]
debug = false

# Release-like lint profile without the cost of full release codegen.
[profile.dev-no-debug-assertions]
inherits = "dev"
debug-assertions = false

# Optimize proc-macro crates in dev for faster compilation
[profile.dev.package.serde_derive]
opt-level = 1
[profile.dev.package.clap_derive]
opt-level = 1

# Optimize snapshot testing deps in dev
[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"                         # Smaller binary, no unwind tables needed

# `cargo bench` and `cargo codspeed build` use this profile. It inherits
# `release`, but fat LTO of the fallow-benchmarks crate graph needs more
# memory than the ubuntu-24.04 CodSpeed runner has (exit code 143).
# Thin LTO keeps the build inside that limit.
[profile.bench]
lto = "thin"

# Profile-with-debug: release-equivalent codegen + debuginfo retained.
# Use for samply / Instruments / perf without enabling LTO+strip in the
# regular release profile.
[profile.release-debug]
inherits = "release"
strip = "none"
debug = "full"

# Shipped @fallow/node addon: release-equivalent codegen, but panics unwind so
# napi-rs can convert them to catchable JS errors instead of aborting the host
# Node process. The CLI binary keeps panic = "abort".
[profile.napi-release]
inherits = "release"
panic = "unwind"

# Coverage profile for cargo-llvm-cov loops: preserve runtime checks while
# avoiding full release build cost.
[profile.coverage]
inherits = "release"
opt-level = 2
codegen-units = 256
lto = "thin"
debug-assertions = true
overflow-checks = true

# Optimize heavy deps for size, not in the hot path
[profile.release.package.regex-syntax]
opt-level = "z"
[profile.release.package.clap_builder]
opt-level = "z"
[profile.release.package.schemars]
opt-level = "z"
[profile.release.package.ureq]
opt-level = "z"
[profile.release.package.miette]
opt-level = "z"
[profile.release.package.toml]
opt-level = "z"
[profile.release.package.toml_parser]
opt-level = "z"
[profile.release.package.url]
opt-level = "z"
[profile.release.package.indicatif]
opt-level = "z"
[profile.release.package.tracing-subscriber]
opt-level = "z"
